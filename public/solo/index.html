<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국사 퀴즈 · 혼자 하기</title>
<!-- 글꼴: 인터넷이 되면 구글 폰트, 안 되면 대체 글꼴로 자연스럽게 내려간다(/shared/fonts.css) -->
<link rel="stylesheet" href="/shared/fonts.css">
<style>
/* 레이아웃: 위에 문제 두루마리, 가운데 한옥 마당(캔버스) 위를 캐릭터가 걸어 다님, 아래에 조작판. 한지 바탕, 단청 띠, 창살 격자. */
:root{
  --hanji:#f6efe1; --hanji-deep:#ece1ca; --meok:#2a241d; --meok-muted:#675b4c;
  --red:#b03a2b; --cheong:#1f5f5b; --hwang:#d9a441; --on-color:#ffffff;
  --hairline:#c9b994; --correct:#2f6b3a; --wrong:#9a2f2f;
  --ground:#e4d6b8; --stone:#d3c29f; --lattice:rgba(42,36,29,.045);
  --s2:8px; --s4:16px; --s6:24px; --s8:32px;
  --r-sm:4px; --r-md:12px; --r-lg:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hanji:#1e1a15; --hanji-deep:#2a241d; --meok:#f1e8d6; --meok-muted:#b8aa92;
  --red:#e0735f; --cheong:#6aaea5; --hwang:#e3b65c; --on-color:#1e1a15;
  --hairline:#4a4136; --correct:#7cc08a; --wrong:#e88b84;
  --ground:#332c23; --stone:#3e362b; --lattice:rgba(241,232,214,.035);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --hanji:#1e1a15; --hanji-deep:#2a241d; --meok:#f1e8d6; --meok-muted:#b8aa92;
  --red:#e0735f; --cheong:#6aaea5; --hwang:#e3b65c; --on-color:#1e1a15;
  --hairline:#4a4136; --correct:#7cc08a; --wrong:#e88b84;
  --ground:#332c23; --stone:#3e362b; --lattice:rgba(241,232,214,.035);
  color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--hanji); color:var(--meok);
  background-image:linear-gradient(var(--lattice) 2px,transparent 2px),linear-gradient(90deg,var(--lattice) 2px,transparent 2px);
  background-size:56px 56px;
  font-family:var(--sans); font-size:18px; line-height:28px;
  padding-inline:16px; padding-block:0 var(--s8);
}
.band{height:12px; margin-inline:-16px; background:repeating-linear-gradient(90deg,var(--red) 0 40px,var(--hanji-deep) 40px 46px,var(--cheong) 46px 86px,var(--hanji-deep) 86px 92px,var(--hwang) 92px 112px,var(--hanji-deep) 112px 118px)}
.wrap{max-width:980px; margin:0 auto; padding-top:var(--s6); display:flex; flex-direction:column; gap:var(--s4)}
.top{display:flex; align-items:center; justify-content:space-between; gap:var(--s4); flex-wrap:wrap}
.logo{font-family:var(--serif); font-weight:700; font-size:24px; line-height:32px; letter-spacing:.04em; background:none; border:0; color:var(--meok); padding:0; cursor:pointer}
.logo span{color:var(--red)}
.chip{font-size:15px; line-height:22px; color:var(--meok-muted); border:1px solid var(--hairline); border-radius:var(--r-sm); padding:2px var(--s2); background:var(--hanji)}
h1,h2{font-family:var(--serif); font-weight:700; margin:0; text-wrap:balance}
.display{font-size:48px; line-height:56px}
h2{font-size:24px; line-height:32px}
p{margin:0}
.muted{color:var(--meok-muted)}
.cap{font-size:15px; line-height:22px}
.board{background:var(--hanji-deep); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:var(--s8) var(--s6); display:flex; flex-direction:column; gap:var(--s6)}

/* 시작 화면 */
.hero{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:var(--s6); align-items:center}
.hero .display span{color:var(--red)}
.hero-text{display:flex; flex-direction:column; gap:var(--s4); min-width:0}
.preview{width:100%; aspect-ratio:1; max-width:220px; border-radius:var(--r-md); border:1px solid var(--hairline); background:var(--ground)}
.field{display:flex; flex-direction:column; gap:var(--s2)}
.field label,.field .lbl{font-weight:700}
.row{display:flex; gap:var(--s2); flex-wrap:wrap; align-items:center}
input[type=text]{font:inherit; color:var(--meok); background:var(--hanji); border:2px solid var(--hairline); border-radius:var(--r-md); padding:10px var(--s4); min-height:52px; width:min(100%,280px)}
input[type=text]:focus{outline:3px solid var(--hwang); outline-offset:2px}
.swatch{width:48px; height:48px; border-radius:50%; border:3px solid var(--hanji); box-shadow:0 0 0 2px var(--hairline); cursor:pointer; padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--meok)}
.levels{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s4)}
.level{display:flex; flex-direction:column; gap:var(--s2); text-align:left; min-height:160px; padding:var(--s6) var(--s4); border-radius:var(--r-md); border:2px solid var(--hairline); background:var(--hanji); color:var(--meok); font:inherit; cursor:pointer; transition:border-color .15s, transform .15s}
.level:hover:not(:disabled){border-color:var(--cheong); transform:translateY(-2px)}
.level:disabled{cursor:not-allowed; opacity:.6}
.level .name{font-family:var(--serif); font-weight:700; font-size:24px; line-height:32px}
.level .kind{color:var(--cheong); font-weight:700}
.level .go{margin-top:auto; font-size:15px; line-height:22px; color:var(--meok-muted)}
.howto{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s4)}
.howto div{display:flex; gap:var(--s2); align-items:baseline}
.howto b{font-family:var(--serif); color:var(--cheong); font-size:20px; flex:none}

/* 게임 화면 */
.qcard{background:var(--hanji); border:1px solid var(--hairline); border-radius:var(--r-md); padding:var(--s4) var(--s6); display:flex; flex-direction:column; gap:var(--s2)}
.qhead{display:flex; justify-content:space-between; align-items:center; gap:var(--s4); flex-wrap:wrap}
.qnum{font-family:var(--serif); font-weight:700; font-size:20px; color:var(--cheong); font-variant-numeric:tabular-nums}
.badge{font-size:15px; line-height:22px; padding:2px var(--s2); border-radius:var(--r-sm); background:var(--cheong); color:var(--on-color); font-weight:700}
.question{font-size:26px; line-height:36px}
.progress{display:flex; gap:6px}
.progress i{flex:1; height:8px; border-radius:var(--r-sm); background:var(--hanji-deep); border:1px solid var(--hairline)}
.progress i.ok{background:var(--correct); border-color:var(--correct)}
.progress i.no{background:var(--wrong); border-color:var(--wrong)}
.progress i.now{background:var(--hwang); border-color:var(--hwang)}
.timer{display:flex; align-items:center; gap:var(--s4)}
.timer .bar{flex:1; height:12px; border-radius:var(--r-sm); background:var(--hanji-deep); border:1px solid var(--hairline); overflow:hidden}
.timer .fill{height:100%; background:var(--cheong); transform-origin:left; width:100%}
.timer .fill.low{background:var(--red)}
.timer .sec{font-family:var(--serif); font-weight:700; font-size:22px; width:3.2em; text-align:right; font-variant-numeric:tabular-nums}

.stage{position:relative; border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--hairline); background:var(--ground); touch-action:none}
canvas{display:block; width:100%; height:auto; cursor:pointer}
.stage:focus-visible{outline:3px solid var(--hwang); outline-offset:3px}

.controls{display:grid; grid-template-columns:minmax(0,1fr); gap:var(--s4); align-items:start}
.status{display:flex; flex-direction:column; gap:var(--s2); min-width:0}
/* 조이스틱: 손가락으로 쓰는 기기(폰·태블릿)에서만 보인다. 컴퓨터는 W A S D. */
.joy{display:none; position:relative; width:136px; height:136px; border-radius:50%; background:var(--hanji); border:2px solid var(--hairline); box-shadow:inset 0 0 0 10px var(--hanji-deep); touch-action:none; user-select:none; -webkit-user-select:none}
.joy .knob{position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:var(--cheong); border:3px solid var(--hanji); box-shadow:0 2px 6px rgba(0,0,0,.25); pointer-events:none}
.joy.on .knob{background:var(--hwang)}
@media (hover:none) and (pointer:coarse){
  .joy{display:block}
  .controls{grid-template-columns:minmax(0,1fr) auto; align-items:center}
}
.where{font-size:20px; line-height:28px}
.where b{font-family:var(--serif)}
.hint{border:1px dashed var(--hwang); border-radius:var(--r-md); padding:var(--s2) var(--s4); background:var(--hanji)}

.actions{display:flex; gap:var(--s4); flex-wrap:wrap}
.btn{font:inherit; font-size:18px; line-height:24px; font-weight:700; min-height:52px; padding:var(--s4) var(--s6); border-radius:var(--r-md); cursor:pointer; border:2px solid transparent}
.btn-primary{background:var(--red); color:var(--on-color)}
.btn-secondary{background:transparent; color:var(--cheong); border-color:var(--cheong)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-primary:hover:not(:disabled){filter:brightness(1.06)}

.feedback{background:var(--hanji); border:1px solid var(--hairline); border-radius:var(--r-md); padding:var(--s6); display:flex; flex-direction:column; gap:var(--s4)}
.verdict{display:flex; align-items:center; gap:var(--s4)}
.verdict .sym{flex:none; width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-family:var(--serif); font-weight:700; font-size:30px; border:3px solid currentColor}
.verdict.ok{color:var(--correct)} .verdict.no{color:var(--wrong)}
.verdict h2{color:var(--meok)}
.explain{font-size:20px; line-height:32px}

/* 결과 */
.result{align-items:center; text-align:center}
.score{font-family:var(--serif); font-weight:700; font-size:88px; line-height:1; font-variant-numeric:tabular-nums}
.score small{font-size:32px; color:var(--meok-muted)}
.rank{display:flex; flex-direction:column; align-items:center; gap:var(--s2)}
.rank .title{font-family:var(--serif); font-weight:700; font-size:48px; line-height:56px; color:var(--red)}
.ladder{display:flex; flex-wrap:wrap; justify-content:center; gap:var(--s2)}
.ladder span{font-size:15px; line-height:22px; padding:2px 10px; border-radius:var(--r-sm); border:1px solid var(--hairline); color:var(--meok-muted)}
.ladder span.on{background:var(--red); border-color:var(--red); color:var(--on-color); font-weight:700}
.review{width:100%; text-align:left}
.review ol{list-style:none; margin:0; padding:0}
.review li{display:flex; gap:var(--s4); align-items:baseline; padding:var(--s2) 0; border-bottom:1px solid var(--hairline)}
.review .m{flex:none; width:28px; font-weight:700; font-family:var(--serif)}
.review .m.ok{color:var(--correct)} .review .m.no{color:var(--wrong)}
.result .actions{justify-content:center}

button:focus-visible{outline:3px solid var(--hwang); outline-offset:3px}
footer{text-align:center}
#app{display:flex; flex-direction:column; gap:var(--s4)}
@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .preview{max-width:160px}
  .levels,.howto{grid-template-columns:1fr}
  .level{min-height:0}
  .display{font-size:38px; line-height:46px}
  .question{font-size:22px; line-height:32px}
  .board{padding:var(--s6) var(--s4)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@keyframes pop{from{transform:scale(.9); opacity:.4} to{transform:none; opacity:1}}
.verdict .sym,.rank .title{animation:pop .3s ease-out}
</style>

<div class="band" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <button class="logo" id="home" type="button" aria-label="처음 화면으로">한국<span>사</span></button>
    <span class="chip" id="status">혼자 하기(비상용)</span>
  </div>
  <main id="app" aria-live="polite"></main>
  <footer class="cap muted"><a href="/" style="color:var(--cheong)">다른 화면 고르기</a> · 컴퓨터는 W A S D(방향키도 돼요) · 폰은 조이스틱 · 마당을 눌러도 그쪽으로 걸어가요 · 스페이스로 결정</footer>
</div>

<script>
const QUIZ = {
  elem: {
    name: "초등부", kind: "O/X 퀴즈", desc: "태극기, 한글, 명절, 전통 놀이처럼 생활 속에서 만나는 쉬운 우리 역사",
    questions: [
      // 혼자 하기 초등부(진행자·학생 화면의 초등부는 Supabase 의 문제를 쓴다)
      // ① 저학년도 풀 수 있는 문제 42개: 눈에 보이고 생활에서 겪는 것. 날짜·어려운 낱말 없이
      {t:"ox", q:"태극기는 우리나라 국기이다.", a:"O", hint:"국경일에 집집마다 다는 깃발이에요.", ex:"태극기는 우리나라를 나타내는 국기예요."},
      {t:"ox", q:"태극기의 바탕색은 흰색이다.", a:"O", hint:"태극기를 떠올려 보세요. 바탕이 하얘요.", ex:"태극기는 흰 바탕에 태극 무늬와 검은 막대 네 개가 있어요."},
      {t:"ox", q:"태극기 가운데 동그라미는 초록색과 노란색이다.", a:"X", hint:"빨간색과 파란색이에요.", ex:"태극기 가운데 동그라미(태극 무늬)는 빨간색과 파란색이에요."},
      {t:"ox", q:"우리나라 꽃은 무궁화이다.", a:"O", hint:"'무'로 시작하는 꽃이에요.", ex:"무궁화는 우리나라를 대표하는 꽃이에요."},
      {t:"ox", q:"우리나라의 이름은 '대한민국'이다.", a:"O", hint:"줄여서 '한국'이라고도 해요.", ex:"우리나라의 이름은 대한민국이에요."},
      {t:"ox", q:"우리나라의 이름은 '미국'이다.", a:"X", hint:"줄여서 '한국'이라고 해요.", ex:"우리나라의 이름은 대한민국이에요. 미국은 다른 나라예요."},
      {t:"ox", q:"독도는 우리나라 땅이다.", a:"O", hint:"동쪽 바다에 있는 우리 섬이에요.", ex:"독도는 동해에 있는 우리나라 섬이에요."},
      {t:"ox", q:"한글은 세종대왕이 만들었다.", a:"O", hint:"만 원짜리 지폐에 그려진 왕이에요.", ex:"세종대왕은 백성들이 쉽게 글을 쓰도록 한글을 만들었어요."},
      {t:"ox", q:"한글은 우리가 매일 읽고 쓰는 글자이다.", a:"O", hint:"지금 이 문제도 한글로 쓰여 있어요!", ex:"우리가 매일 쓰는 글자가 바로 한글이에요."},
      {t:"ox", q:"세종대왕은 우리나라의 옛날 왕이다.", a:"O", hint:"한글을 만든 분이에요.", ex:"세종대왕은 조선의 왕이에요."},
      {t:"ox", q:"세종대왕은 축구 선수이다.", a:"X", hint:"한글을 만든 분이에요.", ex:"세종대왕은 축구 선수가 아니라 한글을 만든 조선의 왕이에요."},
      {t:"ox", q:"이순신 장군은 바다에서 나라를 지켰다.", a:"O", hint:"배를 타고 싸웠어요.", ex:"이순신 장군은 배를 타고 바다에서 나라를 지켰어요."},
      {t:"ox", q:"거북선은 거북을 닮은 배이다.", a:"O", hint:"이름에 답이 있어요.", ex:"거북선은 거북 모양을 닮은 배예요."},
      {t:"ox", q:"거북선은 하늘을 나는 비행기이다.", a:"X", hint:"이름 끝이 '선(배)'이에요.", ex:"거북선은 바다에 떠 있는 배예요."},
      {t:"ox", q:"설날에는 떡국을 먹는다.", a:"O", hint:"한 그릇 먹으면 한 살 더 먹는다고 해요.", ex:"설날 아침에는 떡국을 먹어요."},
      {t:"ox", q:"설날에 먹는 떡국에는 아이스크림이 들어간다.", a:"X", hint:"떡국에는 하얀 떡이 들어가요.", ex:"떡국에는 얇게 썬 하얀 떡이 들어가요."},
      {t:"ox", q:"추석에는 송편을 먹는다.", a:"O", hint:"반달 모양의 떡이에요.", ex:"추석에는 송편을 빚어 먹어요."},
      {t:"ox", q:"송편은 반달 모양의 떡이다.", a:"O", hint:"손으로 빚어 반으로 접은 모양이에요.", ex:"송편은 반달처럼 생긴 떡이에요."},
      {t:"ox", q:"설날에 어른께 절을 하면 세뱃돈을 받기도 한다.", a:"O", hint:"새해 인사를 하면 받아요.", ex:"설날에 세배를 하면 어른들이 덕담과 세뱃돈을 주시기도 해요."},
      {t:"ox", q:"세배는 서서 손을 흔드는 인사이다.", a:"X", hint:"무릎을 꿇고 절을 해요.", ex:"세배는 웃어른께 공손하게 절을 하는 거예요."},
      {t:"ox", q:"명절에는 가족들이 모여 함께 지낸다.", a:"O", hint:"할머니 댁에 가요.", ex:"설날과 추석에는 가족들이 모여 함께 지내요."},
      {t:"ox", q:"한복은 우리나라의 옛날 옷이다.", a:"O", hint:"명절에 입는 고운 옷이에요.", ex:"한복은 우리나라의 전통 옷이에요."},
      {t:"ox", q:"한복은 축구할 때 입는 운동복이다.", a:"X", hint:"명절에 입는 고운 옷이에요.", ex:"한복은 운동복이 아니라 우리나라의 전통 옷이에요."},
      {t:"ox", q:"김치는 배추로 만든다.", a:"O", hint:"빨갛고 매콤한 반찬이에요.", ex:"김치는 배추나 무에 양념을 버무려 만들어요."},
      {t:"ox", q:"김치는 달콤한 초콜릿으로 만든다.", a:"X", hint:"김치는 매콤해요.", ex:"김치는 배추나 무로 만들어요."},
      {t:"ox", q:"비빔밥은 빵 사이에 고기를 넣은 음식이다.", a:"X", hint:"이름에 '밥'이 들어 있어요.", ex:"비빔밥은 밥에 여러 나물을 넣고 비벼 먹는 우리 음식이에요."},
      {t:"ox", q:"윷놀이는 윷을 던져서 하는 놀이이다.", a:"O", hint:"도, 개, 걸, 윷, 모!", ex:"윷놀이는 윷가락 네 개를 던져서 하는 놀이예요."},

const shuffle = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rankOf = n => RANKS.filter(r => n >= r.min).pop();

const USED_KEY = "hqs.used";
const used = (() => {
  const blank = {elem:[], mid:[], high:[]};
  try {
    const saved = JSON.parse(localStorage.getItem(USED_KEY) || "{}");
    for(const k of Object.keys(blank)) if(Array.isArray(saved[k])) blank[k] = saved[k].filter(i => Number.isInteger(i) && i >= 0 && i < QUIZ[k].questions.length);
  } catch {}
  return blank;
})();
const saveUsed = () => { try { localStorage.setItem(USED_KEY, JSON.stringify(used)); } catch {} };

// 주관식 채점: 띄어쓰기·가운뎃점·문장 부호는 보지 않는다.
// '우산국(울릉도)' 은 괄호 앞뒤 어느 쪽만 써도, '1592년' 은 '1592' 만 써도, 'A와 B' 는 'B와 A' 로 써도 맞다.
const normAns = s => String(s).normalize("NFC").toLowerCase().replace(/[\s·・.,'"()\[\]「」『』\-~]/g, "");
function accepts(a){
  const out = new Set([a]);
  const paren = a.match(/^(.+?)\((.+)\)$/);
  if(paren){ out.add(paren[1]); out.add(paren[2]); }
  const year = a.match(/^(\d+)년$/);
  if(year) out.add(year[1]);
  const pair = a.match(/^(.+?)[와과] (.+)$/);
  if(pair){ out.add(pair[2]+"와"+pair[1]); out.add(pair[2]+"과"+pair[1]); out.add(pair[1]+pair[2]); out.add(pair[2]+pair[1]); }
  return [...out].map(normAns);
}
// '광개토대왕이에요' / '고려청자예요': 끝 글자에 받침이 있으면 '이에요'.
const copula = s => { const c = String(s).replace(/[\s)』」]+$/, "").slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? "이에요" : "예요"; };
const isRight =(q, picked) => q.t === "sa" ? picked !== null && accepts(q.a).includes(normAns(picked)) : picked === q.a;
function buildRound(level){
  const all = QUIZ[level].questions.map((_,k)=>k);
  const fresh = shuffle(all.filter(k => !used[level].includes(k)));
  let ids;
  if(fresh.length >= ROUND){ ids = fresh.slice(0, ROUND); used[level] = used[level].concat(ids); }
  else { const fill = shuffle(all.filter(k => !fresh.includes(k))).slice(0, ROUND - fresh.length); ids = shuffle(fresh.concat(fill)); used[level] = fill.slice(); }
  saveUsed();
  return ids.map(k => {
    const q = QUIZ[level].questions[k];
    if(q.t !== "mc") return {...q};
    const order = shuffle([0,1,2,3]);
    return {...q, c: order.map(o => q.c[o]), a: order.indexOf(q.a)};
  });
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();}

function drawPerson(ctx,x,y,opt){
  const t = opt.t||0, bob = opt.moving ? Math.sin(t*14)*2.5 : 0;
  ctx.save(); ctx.translate(x, y+bob);
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(0, 22-bob, 18, 6, 0, 0, Math.PI*2); ctx.fill();
  // 치마/바지
  ctx.fillStyle = opt.lower; ctx.beginPath(); ctx.moveTo(-15,4); ctx.lineTo(15,4); ctx.lineTo(19,22); ctx.lineTo(-19,22); ctx.closePath(); ctx.fill();
  // 저고리
  ctx.fillStyle = opt.upper; roundRect(ctx,-14,-10,28,18,6); ctx.fill();
  // 고름
  ctx.strokeStyle = opt.ribbon; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(5,8); ctx.moveTo(0,-6); ctx.lineTo(-3,9); ctx.stroke();
  // 얼굴
  ctx.fillStyle = "#f3d6b6"; ctx.beginPath(); ctx.arc(0,-22,14,0,Math.PI*2); ctx.fill();
  // 머리
  ctx.fillStyle = "#2b2420"; ctx.beginPath(); ctx.arc(0,-24,14.5,Math.PI*1.05,Math.PI*1.95); ctx.fill();
  if(opt.hat){ // 갓
    ctx.fillStyle = "#1c1814"; ctx.beginPath(); ctx.ellipse(0,-33,22,5,0,0,Math.PI*2); ctx.fill();
    roundRect(ctx,-8,-48,16,15,4); ctx.fill();
  } else { // 댕기머리
    ctx.fillStyle = opt.ribbon; roundRect(ctx,10,-30,6,12,2); ctx.fill();
  }
  ctx.fillStyle = "#2b2420"; ctx.beginPath(); ctx.arc(-5,-21,1.8,0,Math.PI*2); ctx.arc(5,-21,1.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(214,110,90,.45)"; ctx.beginPath(); ctx.arc(-8,-16,2.6,0,Math.PI*2); ctx.arc(8,-16,2.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

  ctx.strokeStyle = C.line; ctx.lineWidth=2; for(let x=0;x<W;x+=48){ ctx.strokeRect(x+4,58,40,22); }
  // 디딤돌 길
  ctx.fillStyle = C.stone; for(let y=500;y>110;y-=56){ ctx.beginPath(); ctx.ellipse(480,y,26,14,0,0,Math.PI*2); ctx.fill(); }
  // 나무
  [[60,150],[900,150],[900,520]].forEach(([x,y])=>{
    ctx.fillStyle = C.muted; ctx.fillRect(x-4,y,8,22);
    ctx.fillStyle = C.cheong; ctx.globalAlpha=.75; ctx.beginPath(); ctx.arc(x,y-6,24,0,Math.PI*2); ctx.arc(x-14,y+6,16,0,Math.PI*2); ctx.arc(x+14,y+6,16,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
  });
}

function wrapText(ctx, text, maxW){
  const words = text.split(" "); const lines=[]; let line="";
  for(const w of words){ const test = line ? line+" "+w : w; if(ctx.measureText(test).width > maxW && line){ lines.push(line); line=w; } else line=test; }
  lines.push(line); return lines;
}

function drawZones(ctx){
  const q = S.round[S.i], answered = S.picked !== undefined;
  const C = {hanji:cv("--hanji"), line:cv("--hairline"), meok:cv("--meok"), muted:cv("--meok-muted"), red:cv("--red"), cheong:cv("--cheong"), ok:cv("--correct"), no:cv("--wrong"), hwang:cv("--hwang")};
  for(const z of G.zones){
    const here = inZone(G.p, z);
    let border = here ? C.hwang : C.line, lw = here ? 5 : 3;
    if(answered){ if(z.key===q.a){border=C.ok; lw=6} else if(z.key===S.picked){border=C.no; lw=6} }
    ctx.fillStyle = C.hanji; ctx.globalAlpha = .82; roundRect(ctx,z.x,z.y,z.w,z.h,18); ctx.fill(); ctx.globalAlpha = 1;
    // 돗자리 결
    ctx.save(); roundRect(ctx,z.x,z.y,z.w,z.h,18); ctx.clip();
    ctx.strokeStyle = C.line; ctx.globalAlpha=.35; ctx.lineWidth=1; for(let yy=z.y+10; yy<z.y+z.h; yy+=10){ ctx.beginPath(); ctx.moveTo(z.x,yy); ctx.lineTo(z.x+z.w,yy); ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha=1;
    ctx.strokeStyle = border; ctx.lineWidth = lw; roundRect(ctx,z.x,z.y,z.w,z.h,18); ctx.stroke();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    if(q.t==="ox"){
      ctx.fillStyle = z.key==="O" ? C.cheong : C.red;
      ctx.font = `700 150px ${cv("--serif")}`; ctx.fillText(z.label, z.x+z.w/2, z.y+z.h/2-14);
      ctx.fillStyle = C.muted; ctx.font = `22px ${cv("--sans")}`; ctx.fillText(z.sub, z.x+z.w/2, z.y+z.h-30);
    } else {
      ctx.fillStyle = C.cheong; ctx.font = `700 40px ${cv("--serif")}`; ctx.fillText(z.label, z.x+40, z.y+z.h/2);
      ctx.fillStyle = C.meok; ctx.font = `26px ${cv("--sans")}`; ctx.textAlign="left";
      const lines = wrapText(ctx, z.sub, z.w-100);
      lines.forEach((l,i)=> ctx.fillText(l, z.x+76, z.y+z.h/2 + (i-(lines.length-1)/2)*32));
    }
    if(answered && (z.key===q.a || z.key===S.picked)){
      ctx.textAlign="right"; ctx.font = `700 34px ${cv("--serif")}`;
      ctx.fillStyle = z.key===q.a ? C.ok : C.no; ctx.fillText(z.key===q.a ? "○ 정답" : "×", z.x+z.w-18, z.y+30);
    }
  }
}

function drawScene(t){
  const cvs = document.getElementById("yard"); if(!cvs) return;
  const ctx = cvs.getContext("2d");
  const dpr = cvs.width / W; ctx.setTransform(dpr,0,0,dpr,0,0);
  drawYard(ctx,t);
  drawZones(ctx);
  // 훈장님
  drawPerson(ctx, 480, 118, {upper:cv("--hanji"), lower:cv("--hanji"), ribbon:cv("--meok-muted"), hat:true});
  ctx.fillStyle = cv("--meok"); ctx.font = `15px ${cv("--sans")}`; ctx.textAlign="center"; ctx.fillText("훈장님", 480, 156);
  // 힌트 두루마리
  if(S.picked === undefined){
    const near = Math.hypot(G.p.x-SCROLL.x, G.p.y-SCROLL.y) < 50;
    ctx.save(); ctx.translate(SCROLL.x, SCROLL.y + Math.sin(t*3)*3);
    ctx.fillStyle = cv("--hanji"); ctx.strokeStyle = near||S.hint ? cv("--hwang") : cv("--hairline"); ctx.lineWidth=3;
    roundRect(ctx,-22,-16,44,32,6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = cv("--hwang"); ctx.fillRect(-26,-18,6,36); ctx.fillRect(20,-18,6,36);
    ctx.fillStyle = cv("--meok"); ctx.font = `700 18px ${cv("--serif")}`; ctx.textBaseline="middle"; ctx.fillText("?",0,1);
    ctx.restore();
    ctx.fillStyle = cv("--meok-muted"); ctx.font = `14px ${cv("--sans")}`; ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.fillText("힌트", SCROLL.x, SCROLL.y+40);
  }
  // 걸어가는 목표 표시
  if(G.target && S.picked === undefined){ ctx.strokeStyle = cv("--hwang"); ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(G.target.x,G.target.y+20,16,6,0,0,Math.PI*2); ctx.stroke(); }
  // 내 캐릭터
  const col = cv(COLORS.find(c=>c.id===player.color).css);
  drawPerson(ctx, G.p.x, G.p.y, {upper:col, lower:cv("--meok-muted"), ribbon:cv("--red"), t, moving:G.moving});
  ctx.font = `700 16px ${cv("--sans")}`; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  const tag = player.name || "나"; const tw = ctx.measureText(tag).width + 16;
  ctx.fillStyle = cv("--meok"); ctx.globalAlpha=.85; roundRect(ctx, G.p.x-tw/2, G.p.y+28, tw, 24, 8); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle = cv("--hanji"); ctx.fillText(tag, G.p.x, G.p.y+45);
}

/* ---------------- 화면: 게임 ---------------- */
function start(level){
  S = {screen:"quiz", level, i:0, picked:undefined, hint:false, results:[], round:buildRound(level)};
  renderQuiz();
}

function renderQuiz(){
  const L = QUIZ[S.level], Q = S.round, q = Q[S.i];
  statusChip.textContent = `${L.name} · ${L.kind}`;
  const sa = q.t === "sa";
  G = {p:{...START}, target:null, moving:false, zones:sa ? [] : zonesFor(q), left:TIME[q.t], last:performance.now(), t:0};
  const dots = Q.map((_,k)=>`<i class="${k<S.results.length?(S.results[k]?"ok":"no"):(k===S.i?"now":"")}"></i>`).join("");
  app.innerHTML = `
  <section class="qcard">
    <div class="progress" aria-hidden="true">${dots}</div>
    <div class="qhead">
      <span class="qnum">${S.i+1} / ${Q.length}</span>
      <span class="badge">${q.t==="ox"?"O/X":sa?"주관식":"객관식"}</span>
    </div>
    <h2 class="question">${esc(q.q)}</h2>
    <div class="timer" id="timer"><div class="bar"><div class="fill" id="tfill"></div></div><span class="sec" id="tsec">${TIME[q.t]}초</span></div>
  </section>
  ${sa ? "" : `<div class="stage" id="stage" tabindex="0" aria-label="한옥 마당. 방향키로 캐릭터를 움직여 정답 자리에 서세요.">
    <canvas id="yard" width="${W*2}" height="${H*2}"></canvas>
  </div>`}
  <div id="below"></div>`;
  renderBelow();
  // 주관식은 마당 없이 답 칸만 쓴다. 타이머는 같은 루프가 돌린다.
  if(sa){ document.getElementById("answer").focus({preventScroll:true}); startLoop(); return; }

  const stage = document.getElementById("stage"), cvs = document.getElementById("yard");
  const toYard = e => { const r = cvs.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; };
  stage.onpointerdown = e => {
    if(S.picked!==undefined) return;
    const p = toYard(e);
    stage.focus({preventScroll:true});
    // 두루마리(와 그 아래 '힌트' 글자)를 클릭·터치하면 걸어가지 않고 바로 힌트를 연다
    if(Math.abs(p.x-SCROLL.x) <= 40 && p.y >= SCROLL.y-34 && p.y <= SCROLL.y+50){ showHint(); return; }
    G.target = clampYard(p);
  };
  stage.focus({preventScroll:true});
  startLoop();
}

function renderBelow(){
  const below = document.getElementById("below"); if(!below) return;
  const q = S.round[S.i];
  if(S.picked === undefined && q.t === "sa"){
    below.innerHTML = `
    <form class="status" id="saForm" autocomplete="off">
      <label class="where" for="answer">정답을 써 주세요.</label>
      <input type="text" id="answer" maxlength="30" placeholder="예: 세종대왕" enterkeyhint="done">
      <p class="hint" id="hintbox" ${S.hint?"":"hidden"}><b>힌트</b> · ${esc(q.hint)}</p>
      <div class="actions">
        <button class="btn btn-primary" type="submit" id="decide" disabled>이 답으로 결정!</button>
        <button class="btn btn-secondary" type="button" id="hintBtn" ${S.hint?"hidden":""}>힌트 보기</button>
      </div>
    </form>`;
    const input = document.getElementById("answer"), dec = document.getElementById("decide");
    input.oninput = () => { dec.disabled = !input.value.trim(); };
    document.getElementById("saForm").onsubmit = e => { e.preventDefault(); decide(false); };
    document.getElementById("hintBtn").onclick = showHint;
  } else if(S.picked === undefined){
    below.innerHTML = `
    <div class="controls">
      <div class="status">
        <p class="where" id="where">아직 자리를 고르지 않았어요.</p>
        <p class="hint" id="hintbox" ${S.hint?"":"hidden"}><b>힌트</b> · ${esc(q.hint)}</p>
        <div class="actions">
          <button class="btn btn-primary" type="button" id="decide" disabled>여기로 결정!</button>
          <button class="btn btn-secondary" type="button" id="hintBtn" ${S.hint?"hidden":""}>힌트 보기</button>
        </div>
      </div>
      <div class="joy" id="joy" aria-hidden="true"><span class="knob"></span></div>
    </div>`;
    document.getElementById("decide").onclick = () => decide(false);
    document.getElementById("hintBtn").onclick = showHint;
    bindJoystick(document.getElementById("joy"));
  } else {
    const right = S.results[S.i], timeout = S.picked === null, sa = q.t === "sa";
    const rightLabel = q.t==="ox" ? (q.a==="O"?"○ (맞아요)":"× (아니에요)") : sa ? q.a : `${NUMS[q.a]} ${q.c[q.a]}`;
    const why = !timeout ? (sa ? `내가 쓴 답은 '${esc(S.picked)}'. ` : "") : sa ? "답을 쓰지 않았어요. " : "정답 자리에 서 있지 않았어요. ";
    const last = S.i === S.round.length-1;
    below.innerHTML = `
    <div class="feedback">
      <div class="verdict ${right?"ok":"no"}">
        <span class="sym" aria-hidden="true">${right?"○":"×"}</span>
        <div>
          <h2>${right ? "정답이에요!" : timeout ? "시간이 끝났어요!" : "아쉬워요!"}</h2>
          ${right ? (sa && normAns(S.picked) !== normAns(q.a) ? `<p class="muted">정답은 <b>${esc(rightLabel)}</b>${copula(rightLabel)}.</p>` : "") : `<p class="muted">${why}정답은 <b>${esc(rightLabel)}</b>${copula(rightLabel)}.</p>`}
        </div>
      </div>
      <p class="explain">${esc(q.ex)}</p>
      <div class="actions"><button class="btn btn-primary" type="button" id="nextBtn">${last ? "결과 보기" : "다음 문제"}</button></div>
    </div>`;
    document.getElementById("nextBtn").onclick = next; decidedAt = performance.now();
  }
}

// 조이스틱을 민 방향과 세기(0~1)를 G.joy 에 담는다. 많이 밀수록 빨리 걷는다.
function bindJoystick(joy){
  const knob = joy.firstElementChild, REACH = 46, DEAD = 8;
  const move = e => {
    const r = joy.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    const d = Math.hypot(dx, dy);
    if(d > REACH){ dx *= REACH/d; dy *= REACH/d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    G.joy = d < DEAD ? null : {x:dx/REACH, y:dy/REACH};
    G.target = null;
  };
  const end = () => { G.joy = null; knob.style.transform = ""; joy.classList.remove("on"); };
  joy.onpointerdown = e => { if(S.picked !== undefined) return; e.preventDefault(); joy.setPointerCapture(e.pointerId); joy.classList.add("on"); move(e); };
  joy.onpointermove = e => { if(joy.hasPointerCapture(e.pointerId)) move(e); };
  joy.onpointerup = end; joy.onpointercancel = end; joy.onlostpointercapture = end;
}

function showHint(){
  if(S.hint) return; S.hint = true;
  const hb = document.getElementById("hintbox"), btn = document.getElementById("hintBtn");
  if(hb) hb.hidden = false; if(btn) btn.hidden = true;
}

const clampYard = p => ({x:Math.max(YARD.x+20, Math.min(YARD.x+YARD.w-20, p.x)), y:Math.max(YARD.y+40, Math.min(YARD.y+YARD.h-30, p.y))});

function currentZone(){ return G.zones.find(z => inZone(G.p, z)); }

function step(now){
  const dt = Math.min(.05, (now - G.last)/1000); G.last = now; G.t += dt;
  if(S.picked === undefined && S.round[S.i].t === "sa"){
    tickTimer(dt);
  } else if(S.picked === undefined){
    // 이동
    let dx = 0, dy = 0;
    if(keys.has("ArrowLeft")||keys.has("a")) dx -= 1;
    if(keys.has("ArrowRight")||keys.has("d")) dx += 1;
    if(keys.has("ArrowUp")||keys.has("w")) dy -= 1;
    if(keys.has("ArrowDown")||keys.has("s")) dy += 1;
    const speed = 260;
    if(dx||dy){ G.target = null; const l = Math.hypot(dx,dy); G.p = clampYard({x:G.p.x+dx/l*speed*dt, y:G.p.y+dy/l*speed*dt}); G.moving = true; }
    else if(G.joy){ G.target = null; G.p = clampYard({x:G.p.x+G.joy.x*speed*dt, y:G.p.y+G.joy.y*speed*dt}); G.moving = true; }
    else if(G.target){ const vx = G.target.x-G.p.x, vy = G.target.y-G.p.y, d = Math.hypot(vx,vy);
      if(d < 4){ G.target = null; G.moving = false; } else { const m = Math.min(d, speed*dt); G.p = {x:G.p.x+vx/d*m, y:G.p.y+vy/d*m}; G.moving = true; } }
    else G.moving = false;
    // 위치 안내
    const z = currentZone(), where = document.getElementById("where"), dec = document.getElementById("decide");
    if(where){ const txt = z ? (S.round[S.i].t==="ox" ? `<b>${z.label}</b> 자리에 서 있어요.` : `<b>${z.label} ${esc(z.sub)}</b> 자리에 서 있어요.`) : "아직 자리를 고르지 않았어요.";
      if(where.dataset.k !== String(z?.key)){ where.innerHTML = txt; where.dataset.k = String(z?.key); } }
    if(dec) dec.disabled = !z;
    tickTimer(dt);
  } else G.moving = false;
  drawScene(G.t);
  raf = requestAnimationFrame(step);
}
function tickTimer(dt){
  G.left -= dt;
  const total = TIME[S.round[S.i].t], fill = document.getElementById("tfill"), sec = document.getElementById("tsec");
  if(fill){ fill.style.width = Math.max(0, G.left/total*100)+"%"; fill.classList.toggle("low", G.left <= 3); }
  if(sec) sec.textContent = Math.max(0, Math.ceil(G.left)) + "초";
  if(G.left <= 0) decide(true);
}
function startLoop(){ cancelAnimationFrame(raf); G.last = performance.now(); raf = requestAnimationFrame(step); }
function stopLoop(){ cancelAnimationFrame(raf); raf = 0; keys.clear(); }

function decide(timeUp){
  if(S.picked !== undefined) return;
  const q = S.round[S.i];
  if(q.t === "sa"){
    // 시간이 끝났을 때 칸에 써 둔 답이 있으면 그 답으로 채점한다.
    const typed = (document.getElementById("answer")?.value || "").trim();
    if(!typed && !timeUp) return;
    S.picked = typed || null;
  } else {
    const z = currentZone();
    if(!z && !timeUp) return;
    S.picked = z ? z.key : null;
  }
  S.results.push(isRight(q, S.picked));
  G.target = null; G.joy = null; keys.clear();
  const sec = document.getElementById("tsec"); if(sec && timeUp) sec.textContent = "끝!";
  renderBelow();
}

function next(){
  if(S.i < S.round.length-1){ S.i++; S.picked = undefined; S.hint = false; renderQuiz(); }
  else { S.screen = "result"; renderResult(); }
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------------- 화면: 결과 ---------------- */
function renderResult(){
  stopLoop();
  const L = QUIZ[S.level], Q = S.round;
  const right = S.results.filter(Boolean).length, r = rankOf(right), points = right * POINTS_PER_RIGHT;
  statusChip.textContent = `${L.name} · 결과`;
  app.innerHTML = `
  <section class="board result">
    <p class="muted">${player.name ? esc(player.name)+" 님, " : ""}${L.name} ${Q.length}문제 중 ${right}문제를 맞혔어요</p>
    <div class="score">${points}<small>점</small></div>
    <div class="rank"><p class="muted">오늘의 칭호</p><div class="title">${r.title}</div><p>${r.say}</p></div>
    <div class="ladder" aria-label="칭호 단계">${RANKS.map(x=>`<span class="${x===r?"on":""}">${x.title} ${x.lo===x.hi?x.lo:`${x.lo}~${x.hi}`}점</span>`).join("")}</div>
    <div class="review">
      <p class="cap muted">문제별 결과</p>
      <ol>${Q.map((q,k)=>`<li><span class="m ${S.results[k]?"ok":"no"}">${S.results[k]?"○":"×"}</span><span>${k+1}. ${esc(q.q)}</span></li>`).join("")}</ol>
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="button" id="again">새 문제로 다시 풀기</button>
      <button class="btn btn-secondary" type="button" id="toStart">다음 사람 차례</button>
    </div>
  </section>`;
  document.getElementById("again").onclick = () => start(S.level);
  document.getElementById("toStart").onclick = () => { player.name = ""; goHome(); };
}

function goHome(){ S = {screen:"start"}; renderStart(); }
document.getElementById("home").onclick = goHome;

/* ---------------- 키보드 ---------------- */
const MOVE = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","a","d","w","s"];
// W A S D 는 글자가 아니라 키 자리(e.code)로 읽는다. 한글 입력 상태에서 W 가 'ㅈ' 으로 들어와도 걷게.
const WASD = {KeyW:"w", KeyA:"a", KeyS:"s", KeyD:"d"};
const keyName = e => WASD[e.code] || (e.key.length === 1 ? e.key.toLowerCase() : e.key);
document.addEventListener("keydown", e => {
  if(S.screen !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target && e.target.tagName === "INPUT") return;
  const k = keyName(e);
  if(MOVE.includes(k)){ if(S.picked === undefined){ keys.add(k); e.preventDefault(); } }
  else if((k === " " || k === "Enter") && S.picked === undefined){ e.preventDefault(); decide(false); }
  else if(k === "Enter" && S.picked !== undefined && !e.repeat && performance.now() - decidedAt > 400 && e.target.id !== "nextBtn"){ e.preventDefault(); next(); }
});
document.addEventListener("keyup", e => keys.delete(keyName(e)));
window.addEventListener("blur", () => keys.clear());

// 테마가 바뀌면 시작 화면 미리보기를 다시 그린다(게임 화면은 매 프레임 다시 그림)
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if(S.screen==="start") renderStart(); });

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if(S.screen==="start") renderStart(); });
renderStart();
</script>
