# PR 검사와 자동 머지.
#   · 모든 PR: SQL 테스트(임시 Postgres) + 화면 코드 문법 검사
#   · claude/ 로 시작하는 브랜치의 PR: 검사가 통과하면
#       1) Supabase 에 표와 함수를 올리고 (SQL 이 바뀐 경우)
#       2) main 에 머지한다 → Vercel 이 화면을 새로 배포한다.
#     DB 를 먼저 올리고 머지하므로 화면과 서버가 어긋나지 않는다.
#     SQL 이 바뀌었는데 SUPABASE_DB_URL 비밀값이 없으면 머지하지 않고 멈춘다.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: runner
      PGPASSWORD: runner
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 문제 seed·all.sql 이 최신인지 확인
        run: |
          npm run seed
          git diff --exit-code -- supabase/ || { echo "::error::npm run seed 결과가 커밋과 달라요. npm run seed 를 돌려 커밋해 주세요."; exit 1; }
      - name: 화면 코드 문법 검사
        run: for f in public/shared/*.js public/play/*.js public/host/*.js; do node --check --input-type=module < "$f" || exit 1; done
      - name: SQL 테스트
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          SUPABASE_DB_URL= ./scripts/sql-test.sh

  merge:
    needs: test
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    concurrency: deploy-main            # DB 올리기와 머지는 한 번에 하나씩
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SQL 이 바뀌었는지 확인
        id: sql
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations data/questions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Supabase 에 올리기
        if: steps.sql.outputs.changed == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SQL 이 바뀌었는데 SUPABASE_DB_URL 비밀값이 없어 머지하지 않았어요. README '자동 머지' 를 보세요."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          for f in supabase/migrations/*.sql; do
            echo "-- $(basename "$f")"
            if ! psql -q -d "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f" > /tmp/psql.log 2>&1; then
              grep -v NOTICE /tmp/psql.log
              echo "::error::$f 를 올리지 못했어요"; exit 1
            fi
          done
      - name: main 에 머지
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge
