# SUPABASE_DB_URL 비밀값으로 DB 에 접속되는지만 확인한다(아무것도 바꾸지 않음).
# GitHub → Actions → "DB 접속 확인" → Run workflow 로 돌린다.
name: DB 접속 확인

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 접속 확인
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::SUPABASE_DB_URL 비밀값이 없어요."; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          if ! out=$(PGCONNECT_TIMEOUT=10 psql -d "$SUPABASE_DB_URL" -At -c "select 'ok', hq_seconds('ox'), hq_seconds('mc'), exists(select 1 from pg_proc where proname = 'hq_colors')" 2>&1); then
            echo "$out" | sed -E 's#postgres(ql)?://[^ ]*#(주소 숨김)#g'
            echo "::error::접속하지 못했어요. 비밀번호(특수문자는 %인코딩)나 주소를 확인해 주세요."
            exit 1
          fi
          echo "접속 성공: $out"
          echo "  (ok|O/X 초|객관식 초|색 함수 있음)"
